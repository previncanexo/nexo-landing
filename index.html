
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Previnca Nexo — Tu plan de salud completo · $19.500/mes</title>

      <!-- SEO -->
      <meta name="description" content="Previnca Nexo — Teleconsultas médicas 24/7, emergencias médicas, 50% descuento en farmacias y guardia odontológica. Tu plan de salud completo por $19.500/mes.">
      <meta name="keywords" content="nexo, previnca, plan de salud, teleconsulta, doc24, emergencias, farmacia, odontología, argentina">
      <meta name="author" content="Previnca">

      <!-- Fuentes AUTO-HOSPEDADAS (mismo origen) — @font-face en src/styles/fonts.css.
           Antes se traían de Google Fonts y causaban FOIT en mobile (texto invisible hasta
           que cargaba la fuente). Ahora con font-display:swap el texto sale al instante en
           fuente de sistema. Precargamos las 2 críticas para que la de marca entre rápido. -->
      <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin.woff2" crossorigin>
      <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-serif-display-latin.woff2" crossorigin>

      <!-- Favicon -->
      <link rel="icon" type="image/svg+xml" href="/favicon.svg">
      <link rel="shortcut icon" href="/favicon.svg">
      <link rel="apple-touch-icon" href="/favicon.svg">

      <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
      <meta property="og:type" content="website">
      <meta property="og:locale" content="es_AR">
      <meta property="og:site_name" content="Previnca Nexo">
      <meta property="og:title" content="Previnca Nexo — Tu plan de salud completo · $19.500/mes">
      <meta property="og:description" content="Teleconsultas médicas 24/7, emergencias médicas, 50% descuento en farmacias y guardia odontológica. Todo en un solo plan.">
      <meta property="og:url" content="https://nexo.previncasalud.com.ar">
      <meta property="og:image" content="https://nexo.previncasalud.com.ar/og-image.svg">
      <meta property="og:image:width" content="1200">
      <meta property="og:image:height" content="630">

      <!-- Twitter Card -->
      <meta name="twitter:card" content="summary_large_image">
      <meta name="twitter:title" content="Previnca Nexo — Tu plan de salud completo">
      <meta name="twitter:description" content="Teleconsultas 24/7, emergencias médicas, farmacias y odontología. $19.500/mes.">
      <meta name="twitter:image" content="https://nexo.previncasalud.com.ar/og-image.svg">

      <!-- Canonical -->
      <link rel="canonical" href="https://nexo.previncasalud.com.ar">

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

      <!-- Limpiar caches legacy del onboarding ANTES de que monte React.
           Si quedaron de una sesion vieja, el step 5 → 6 reusaba la URL de MP
           del usuario anterior y los pagos quedaban mal atribuidos. -->
      <script>
        try {
          localStorage.removeItem('nexo_affiliate_id');
          localStorage.removeItem('nexo_checkout_url');
          localStorage.removeItem('nexo_event_id_ic');
        } catch (e) { /* ignore */ }
      </script>

      <!-- Tracking DIFERIDO (GA + Meta Pixel): cargan cuando el navegador está ocioso.
           Eran ~388KB de terceros que competían por ancho de banda/CPU en la carga inicial.
           Se cargan vía requestIdleCallback (no atado a la interacción, para no trabar el
           primer tap); el PageView se registra igual, unos segundos más tarde. -->
      <script>
        (function () {
          var loaded = false;
          function loadTracking() {
            if (loaded) return; loaded = true;
            // Google Analytics
            var ga = document.createElement('script');
            ga.async = true;
            ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-7FEV504KNB';
            document.head.appendChild(ga);
            window.dataLayer = window.dataLayer || [];
            function gtag(){ dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', 'G-7FEV504KNB');
            // Meta Pixel
            !function(f,b,e,v,n,t,s)
            {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
            n.queue=[];t=b.createElement(e);t.async=!0;
            t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)}(window, document,'script',
            'https://connect.facebook.net/en_US/fbevents.js');
            fbq('init', '2187028668714954');
            fbq('track', 'PageView');
          }
          // Expuesto para que el Onboarding fuerce la carga al abrir la modal
          // (sin esperar al idle). Asegura que `_ga` y `_fbp` existan cuando el
          // usuario completa el PATCH y se manda al backend.
          window.loadNexoTrackingNow = loadTracking;
          // Cargar cuando el navegador esté OCIOSO, NO atado a la interacción del usuario.
          // (Antes se disparaba en el primer tap → el primer toque, ej. abrir el menú, se
          //  trababa al cargar ~100KB de tracking en ese instante.) requestIdleCallback no
          // existe en Safari < 16.4 → fallback a setTimeout.
          if ('requestIdleCallback' in window) { requestIdleCallback(loadTracking, { timeout: 3500 }); }
          else { setTimeout(loadTracking, 2500); }
        })();
      </script>
    </head>

    <body>
      <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2187028668714954&ev=PageView&noscript=1"/></noscript>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
